<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>HMI Password</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css?v=11">
</head>

<body>

<main class="app">

  <header>
    <p class="eyebrow">SKBA HMI</p>
    <h1>Password</h1>
    <p id="currentTime" class="current-time"></p>
  </header>


  <!-- 계산식 1 -->
  <section class="calc-card">

    <div class="top-row">

      <div class="multiplier-box">
        <span>배율</span>

        <input
          id="multiplier1"
          type="number"
          inputmode="numeric"
          value="8"
        >
      </div>

      <p
        id="formula1"
        class="formula">
        (YYYY − DD + HH) × 8
      </p>

    </div>


    <div class="bottom-row">

      <p
        id="password1"
        class="password">
        ----
      </p>

      <button
        class="copy-btn"
        data-copy-target="password1">
        복사
      </button>

    </div>

  </section>



  <!-- 계산식 2 -->
  <section class="calc-card">

    <div class="top-row">

      <div class="multiplier-box">
        <span>배율</span>

        <input
          id="multiplier2"
          type="number"
          inputmode="numeric"
          value="5"
        >
      </div>

      <p
        id="formula2"
        class="formula">
        (YYYY − DD + HH) × 5
      </p>

    </div>


    <div class="bottom-row">

      <p
        id="password2"
        class="password">
        ----
      </p>

      <button
        class="copy-btn"
        data-copy-target="password2">
        복사
      </button>

    </div>

  </section>



  <!-- 계산식 3 -->
  <section class="calc-card">

    <div class="top-row">

      <div class="multiplier-box">
        <span>배율</span>

        <input
          id="multiplier3"
          type="number"
          inputmode="numeric"
          value="3"
        >
      </div>

      <p
        id="formula3"
        class="formula">
        (YYYY − DD + HH) × 3
      </p>

    </div>


    <div class="bottom-row">

      <p
        id="password3"
        class="password">
        ----
      </p>

      <button
        class="copy-btn"
        data-copy-target="password3">
        복사
      </button>

    </div>

  </section>


  <p
    id="status"
    class="status"
    aria-live="polite">
  </p>


  <footer>
