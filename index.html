<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>HMI Password</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<main class="app">

  <header>
    <p class="eyebrow">SKBA HMI</p>
    <h1>Password</h1>
    <p id="currentTime" class="current-time"></p>
  </header>


  <!-- 배율 입력 -->
  <div style="
    margin: 0 0 20px 0;
    padding: 20px;
    background: rgba(15,23,42,.88);
    border: 1px solid rgba(148,163,184,.22);
    border-radius: 18px;
  ">

    <label
      for="multiplier"
      style="
        color:#bfdbfe;
        font-weight:900;
        font-size:18px;
      ">
      계산식 배율
    </label>

    <input
      id="multiplier"
      type="number"
      inputmode="numeric"
      value="8"
      style="
        width:90px;
        margin-left:12px;
        padding:10px;
        font-size:22px;
        font-weight:900;
        text-align:center;
        color:white;
        background:#111827;
        border:1px solid #475569;
        border-radius:10px;
      "
    >

  </div>


  <!-- 비밀번호 -->
  <section class="result-card">

    <div>

      <p
        id="formula"
        class="result-label">
        (YYYY − DD + HH) × 8
      </p>

      <p
        id="password"
        class="password">
        ----
      </p>

    </div>

    <button
      class="copy-btn"
      data-copy-target="password">
      복사
    </button>

  </section>


  <p
    id="status"
    class="status"
    aria-live="polite">
  </p>


  <footer>
    현재 시각 기준 · 자동 갱신
  </footer>

</main>


<script src="./app.js?v=5"></script>

</body>
</html>
