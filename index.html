<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>HMI Password</title>

<style>
:root{
  color-scheme:dark;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#0b1220;
  color:#f8fafc;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,rgba(59,130,246,.24),transparent 34rem),
    #0b1220;
}

.app{
  width:min(100%,560px);
  margin:auto;
  padding:26px 18px 18px;
}

header{
  margin-bottom:18px;
}

.eyebrow{
  margin:0 0 3px;
  color:#60a5fa;
  font-weight:900;
  letter-spacing:.18em;
  font-size:16px;
}

h1{
  margin:0;
  font-size:64px;
  line-height:1;
}

.current-time{
  margin:8px 0 0;
  color:#94a3b8;
  font-weight:700;
  font-size:15px;
}

.calc-card{
  margin-bottom:12px;
  padding:14px 16px;
  background:rgba(15,23,42,.88);
  border:1px solid rgba(148,163,184,.22);
  border-radius:20px;
}

.top-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
}

.multiplier-box{
  display:flex;
  align-items:center;
  gap:6px;
}

.multiplier-box span{
  color:#bfdbfe;
  font-size:14px;
  font-weight:900;
}

.multiplier-box input{
  width:55px;
  height:36px;
  padding:0 4px;
  border:1px solid #475569;
  border-radius:9px;
  background:#111827;
  color:white;
  text-align:center;
  font-size:20px;
  font-weight:900;
}

.formula{
  margin:0;
  color:#bfdbfe;
  font-size:14px;
  font-weight:800;
  white-space:nowrap;
}

.bottom-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.password{
  margin:0;
  font-size:64px;
  line-height:.95;
  font-weight:950;
  letter-spacing:.05em;
  font-variant-numeric:tabular-nums;
}

.copy-btn{
  min-width:76px;
  height:52px;
  border:0;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-size:18px;
  font-weight:900;
}

.copy-btn:active{
  transform:scale(.96);
}

.status{
  min-height:20px;
  margin:4px 0;
  color:#86efac;
  text-align:center;
  font-size:13px;
  font-weight:800;
}

footer{
  margin-top:2px;
  color:#64748b;
  text-align:center;
  font-size:12px;
}

@media(max-width:390px){
  .app{padding:20px 13px 12px}
  h1{font-size:56px}
  .calc-card{padding:12px 13px}
  .formula{font-size:12px}
  .password{font-size:56px}
  .copy-btn{min-width:68px;height:48px;font-size:16px}
}
</style>
</head>

<body>

<main class="app">

<header>
  <p class="eyebrow">SKBA HMI</p>
  <h1>Password</h1>
  <p id="currentTime" class="current-time"></p>
</header>


<section class="calc-card">
  <div class="top-row">

    <div class="multiplier-box">
      <span>배율</span>
      <input id="multiplier1" type="number" inputmode="numeric" value="8">
    </div>

    <p id="formula1" class="formula">
      (YYYY − DD + HH) × 8
    </p>

  </div>

  <div class="bottom-row">
    <p id="password1" class="password">----</p>

    <button class="copy-btn" data-target="password1">
      복사
    </button>
  </div>
</section>


<section class="calc-card">
  <div class="top-row">

    <div class="multiplier-box">
      <span>배율</span>
      <input id="multiplier2" type="number" inputmode="numeric" value="5">
    </div>

    <p id="formula2" class="formula">
      (YYYY − DD + HH) × 5
    </p>

  </div>

  <div class="bottom-row">
    <p id="password2" class="password">----</p>

    <button class="copy-btn" data-target="password2">
      복사
    </button>
  </div>
</section>


<section class="calc-card">
  <div class="top-row">

    <div class="multiplier-box">
      <span>배율</span>
      <input id="multiplier3" type="number" inputmode="numeric" value="3">
    </div>

    <p id="formula3" class="formula">
      (YYYY − DD + HH) × 3
    </p>

  </div>

  <div class="bottom-row">
    <p id="password3" class="password">----</p>

    <button class="copy-btn" data-target="password3">
      복사
    </button>
  </div>
</section>


<p id="status" class="status"></p>

<footer>
  현재 시각 기준 · 자동 갱신
</footer>

</main>


<script>

const pad = n =>
  String(n).padStart(2,"0");


const last4 = n =>
  String(
    ((n % 10000) + 10000) % 10000
  ).padStart(4,"0");


function calculate(){

  const now = new Date();

  const year = now.getFullYear();
  const day = now.getDate();
  const hour = now.getHours();

  const base =
    year - day + hour;


  for(let i=1;i<=3;i++){

    const input =
      document.getElementById(
        "multiplier" + i
      );

    const formula =
      document.getElementById(
        "formula" + i
      );

    const password =
      document.getElementById(
        "password" + i
      );


    let multiplier =
      parseInt(
        input.value,
        10
      );


    if(isNaN(multiplier)){
      multiplier = 0;
    }


    formula.textContent =
      `(YYYY − DD + HH) × ${multiplier}`;


    password.textContent =
      last4(
        base * multiplier
      );

  }


  document.getElementById(
    "currentTime"
  ).textContent =
    `${year}-${pad(now.getMonth()+1)}-${pad(day)} `
    +
    `${pad(hour)}:${pad(now.getMinutes())}`;

}


for(let i=1;i<=3;i++){

  document
    .getElementById(
      "multiplier" + i
    )
    .addEventListener(
      "input",
      calculate
    );

}


document
  .querySelectorAll(
    ".copy-btn"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      async () => {

        const id =
          button.dataset.target;

        const value =
          document
            .getElementById(id)
            .textContent;


        try{

          await navigator
            .clipboard
            .writeText(value);

        }
        catch{

          const temp =
            document
              .createElement(
                "textarea"
              );

          temp.value =
            value;

          document
            .body
            .appendChild(temp);

          temp.select();

          document
            .execCommand(
              "copy"
            );

          temp.remove();

        }


        const old =
          button.textContent;

        button.textContent =
          "완료";


        document
          .getElementById(
            "status"
          )
          .textContent =
          `${value} 복사됨`;


        setTimeout(
          () => {

            button.textContent =
              old;

            document
              .getElementById(
                "status"
              )
              .textContent =
              "";

          },
          1200
        );

      }
    );

  });


calculate();

setInterval(
  calculate,
  1000
);

</script>

</body>
</html>
